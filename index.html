<dialog id="dialog"><div id="dialogContent"></div></dialog><div id="toast" role="status" aria-live="polite"></div><script>/* Haseen prototype core — heuristic similarity (demo). No external deps. */
const AR_DIAC = /[ً-ٰٟـ]/g;
const isArabic = s => /[؀-ۿ]/.test(s);

function normArabic(s) {
  let t = s.replace(AR_DIAC, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
    .replace(/[^ء-ي\s]/g, '').replace(/\s+/g, ' ').trim();
  return t.split(' ').map(w => (w.length > 3 && w.startsWith('ال')) ? w.slice(2) : w).join(' ');
}
function normLatin(s) {
  return s.toLowerCase().replace(/[^a-z\s]/g, '').replace(/\s+/g, ' ').trim();
}

const AR_MAP = { 'ا':'a','ء':'','ب':'b','ت':'t','ث':'s','ج':'j','ح':'h','خ':'x','د':'d','ذ':'z','ر':'r','ز':'z',
  'س':'s','ش':'x','ص':'s','ض':'d','ط':'t','ظ':'z','ع':'a','غ':'g','ف':'f','ق':'k','ك':'k','ل':'l','م':'m','ن':'n',
  'ه':'h','و':'w','ي':'y' };

function collapse(s) { return s.replace(/(.)\1+/g, '$1'); }
function skeleton(ph) {            // remove vowels except a leading one
  const c = collapse(ph);
  return c.charAt(0) + c.slice(1).replace(/a/g, '');
}
function arPhonemes(ar, vowelMode) {
  let out = '';
  for (const ch of ar.replace(/\s/g, '')) {
    let p = AR_MAP[ch] ?? '';
    if (vowelMode && (ch === 'و' || ch === 'ي')) p = 'a';
    out += p;
  }
  return out;
}
function latPhonemes(lt) {
  let s = lt.replace(/\s/g, '');
  s = s.replace(/ph/g, 'f').replace(/sh/g, 'x').replace(/kh/g, 'x').replace(/ch/g, 'x')
       .replace(/th/g, 's').replace(/gh/g, 'g').replace(/ck/g, 'k').replace(/qu/g, 'k')
       .replace(/c(?=[aou]|$)/g, 'k').replace(/c/g, 's').replace(/q/g, 'k').replace(/x(?![a-z]*$)/g, 'x')
       .replace(/v/g, 'f').replace(/p/g, 'b').replace(/[eiou]/g, 'a');
  return s;
}
function lev(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const simStr = (a, b) => (!a.length || !b.length) ? 0 : 1 - lev(a, b) / Math.max(a.length, b.length);

function keys(name) {
  if (isArabic(name)) {
    const n = normArabic(name);
    const c = arPhonemes(n, false), v = arPhonemes(n, true);
    return { script: 'ar', norm: n, skels: [skeleton(c), skeleton(v)], full: collapse(c) };
  }
  const n = normLatin(name), ph = latPhonemes(n);
  return { script: 'lat', norm: n, skels: [skeleton(ph)], full: collapse(ph) };
}

const CONCEPTS = [ // قاموس دلالي تجريبي صغير
  ['نور','ضوء','سنا','شعاع','light','lumina','luce','ray'],
  ['صقر','شاهين','falcon','hawk'],
  ['بحر','موج','sea','ocean','wave','marina'],
  ['نخلة','نخيل','palm','date'],
  ['قهوه','بن','coffee','cafe','kahwa'],
];
function concepts(name) {
  const toks = (isArabic(name) ? normArabic(name) : normLatin(name)).split(' ');
  const set = new Set();
  CONCEPTS.forEach((g, i) => { if (toks.some(t => g.map(x => isArabic(x) ? normArabic(x) : x).includes(t))) set.add(i); });
  return set;
}

function nameSimilarity(a, b) {
  const ka = keys(a), kb = keys(b);
  let skel = 0;
  for (const x of ka.skels) for (const y of kb.skels) if (x.length > 1 || y.length > 1) skel = Math.max(skel, simStr(x, y));
  const same = ka.script === kb.script;
  const phon = same ? 0.7 * skel + 0.3 * simStr(ka.full, kb.full) : skel;
  const orth = same ? simStr(ka.norm.replace(/\s/g, ''), kb.norm.replace(/\s/g, '')) : 0;
  const ca = concepts(a), cb = concepts(b);
  const sem = [...ca].some(x => cb.has(x)) ? 0.9 : 0;
  const scores = { phonetic: phon, orthographic: orth, semantic: sem };
  const dominant = Object.keys(scores).reduce((p, k) => scores[k] > scores[p] ? k : p, 'phonetic');
  return { score: scores[dominant], dominant, scores };
}

const NICE = { 3:'مستحضرات التجميل والعناية', 9:'برمجيات وأجهزة', 25:'ملابس وأحذية', 29:'أغذية (لحوم وألبان)',
  30:'أغذية (قهوة وحلويات)', 35:'دعاية وتجارة وتجزئة', 41:'تعليم وترفيه وفنون', 42:'خدمات تقنية وتصميم', 43:'مطاعم وضيافة' };
const RELATED = [[29,30],[29,43],[30,43],[35,25],[35,3],[35,30],[35,29],[9,42],[41,42],[35,41],[35,9],[35,42],[35,43]];
function classRelation(a, b) {
  a = +a; b = +b;
  if (a === b) return { factor: 1, label: 'نفس الفئة' };
  if (RELATED.some(([x, y]) => (x === a && y === b) || (x === b && y === a))) return { factor: 0.75, label: 'فئتان متقاربتان' };
  return { factor: 0.4, label: 'فئتان مختلفتان' };
}
const LEVELS = { high: 0.75, medium: 0.55 };
const levelOf = r => r >= LEVELS.high ? 'high' : r >= LEVELS.medium ? 'medium' : 'low';
const LEVEL_AR = { high: 'مرتفع', medium: 'متوسط', low: 'منخفض' };

function checkMark(name, cls, db) {
  const rows = db.map(m => {
    const s = nameSimilarity(name, m.name), c = classRelation(cls, m.cls);
    const risk = s.score * c.factor;
    return { mark: m, sim: s, cls: c, risk, level: levelOf(risk) };
  }).sort((x, y) => y.risk - x.risk);
  const top = rows[0];
  const level = top ? top.level : 'low';
  return { name, cls, rows, top, level };
}

/* ---- visual: difference hash from 9x8 gray values ---- */
function dHash(gray9x8) {            // array of 72 numbers
  let bits = '';
  for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++)
    bits += gray9x8[y * 9 + x] > gray9x8[y * 9 + x + 1] ? '1' : '0';
  return bits;
}
function hashSimilarity(h1, h2) {
  let d = 0; for (let i = 0; i < h1.length; i++) if (h1[i] !== h2[i]) d++;
  return 1 - d / h1.length;
}

const PROTECT = [
  { id: 'tm', ar: 'علامة تجارية', words: ['شعار','اسم','علامه','علامة','brand','logo','ماركه','هويه'], },
  { id: 'cr', ar: 'حقوق مؤلف', words: ['كتاب','لوحه','لوحة','رسم','رواية','قصيده','أغنية','اغنية','برنامج','تطبيق','صوره','صورة','فيديو','مقال','موسيقى'] },
  { id: 'id', ar: 'نموذج صناعي (تصميم)', words: ['شكل','تصميم المنتج','زجاجه','زجاجة','عبوه','عبوة','هيكل','قالب'] },
  { id: 'pt', ar: 'براءة اختراع', words: ['اختراع','جهاز','آلية','الية','طريقة تصنيع','ابتكار تقني','عملية'] },
];
function advise(text) {
  const t = text.toLowerCase();
  const hits = PROTECT.filter(p => p.words.some(w => t.includes(w)));
  return { hits, abstractIdea: /فكره|فكرة|idea/.test(t) && hits.length === 0 };
}

function retrievePrec(type,relLabel){
 const want=relLabel==='نفس الفئة'?'same':relLabel==='فئتان متقاربتان'?'related':'different';
 const sc=p=>(p.type===type?2:0)+(p.rel===want?1:0)+(want==='different'&&p.rel==='products-differ'?1:0);
 return PRECEDENTS.slice().sort((a,b)=>sc(b)-sc(a)).slice(0,3);
}
const SIM_AR={phonetic:'تشابه صوتي (النطق)',orthographic:'تشابه كتابي',semantic:'تشابه دلالي (المعنى)'};
const PUB_FEED=[{name:'Rafaa',cls:35},{name:'رفاء',cls:30},{name:'Rafah',cls:35},{name:'Zorbex',cls:9},{name:'Lumen',cls:3},{name:'مطعم الديرة',cls:43},{name:'Rawah',cls:35}];
function engineRows(name,cls,db){
 return db.map(m=>{const s=nameSimilarity(name,m.name),c=cls?classRelation(cls,m.cls):{factor:1,label:'الفئة غير محددة'};const risk=s.score*c.factor;return{mark:m,sim:s,cls:c,risk,level:levelOf(risk)}}).sort((a,b)=>b.risk-a.risk);
}
function engineReport(input,uid,date){
 const T={trademark:'علامة تجارية',patent:'براءة اختراع',copyright:'حق مؤلف',design:'نموذج صناعي',unknown:'تحديد نوع الحماية'};
 const base={id:uid(),name:input.name,type:input.type,niceClass:input.niceClass||'',activity:input.activity,createdAt:date(),classification:T[input.type],demo:true,sources:[]};
 if(input.type!=='trademark')return{...base,score:null,metrics:{},matches:[],why:'',guidance:input.type==='unknown'?'يحتاج تحديد نوع الحق إلى مراجعة الوصف مع مختص.':'هذا النوع من الحقوق في النسخة الحالية استشارة وتصنيف فقط؛ كشف التشابه والرصد مخصصان للعلامات التجارية.',recommendation:'استكمل المعلومات واستعن بمختص لتحديد الإجراء المناسب.'};
 const rows=engineRows(input.name,input.niceClass,DEMO_DB),top=rows[0],lv=levelOf(top.risk);
 const score=Math.round(top.risk*100),P=x=>Math.round(x*100);
 const near=top.risk>=0.35;
 const precs=near?retrievePrec(top.sim.dominant,top.cls.label):[];
 const why=top.risk>=LEVELS.medium?`أقرب علامة في القاعدة التجريبية «${top.mark.name}» (فئة ${top.mark.cls}): ${SIM_AR[top.sim.dominant]}، و${top.cls.label}. الخطر = أعلى تشابه × معامل الفئة (${top.cls.factor}).`:'لا توجد في القاعدة التجريبية علامة قريبة بدرجة مقلقة. هذا لا يغني عن البحث الرسمي لدى الهيئة.';
 return{...base,score,metrics:{phonetic:P(top.sim.scores.phonetic),orthographic:P(top.sim.scores.orthographic),semantic:P(top.sim.scores.semantic)},
  matches:rows.slice(0,3).map(r=>({name:r.mark.name,score:P(r.risk),niceClass:String(r.mark.cls),reason:`${SIM_AR[r.sim.dominant]}، ${r.cls.label}.`})),
  why,guidance:input.niceClass?'راجع متطلبات التسجيل والفئة لدى الهيئة السعودية للملكية الفكرية.':'لم تُحدد فئة نيس؛ قُدّر الخطر بأعلى درجة محتملة. حدّد الفئة لنتيجة أدق.',
  recommendation:lv==='high'?'يُنصح بتعديل الاسم أو تغيير الفئة ومراجعة مختص قبل دفع رسوم التسجيل.':lv==='medium'?'يُنصح ببحث موسّع ومراجعة مختص قبل التقديم.':'الخطر منخفض في العينة التجريبية؛ استكمل البحث الرسمي قبل التسجيل.',
  sources:precs.map(p=>({title:`${p.name} — ديوان المظالم (${p.law})، جلسة ${p.year}هـ`,excerpt:p.crit,outcome:p.conf?'اعتُبر التشابه مانعاً':'لم يُعتبر مانعاً',conf:p.conf,url:''}))};

 function result(){const r=data.reports.find(r=>r.id===reportId);if(!r)return head('التقرير غير موجود','قد يكون التقرير غير متاح.',go('التقارير','reports'))+empty('اختر تقريراً من القائمة.');const sc=r.score,rr=risk(sc);return head('تقرير تحليل: '+esc(r.name),type(r.type)+' · '+fmt(r.createdAt),`<div class="no-print" style="display:flex;gap:8px;flex-wrap:wrap">${go('التقارير','reports','','secondary')}${btn('طباعة / PDF','print','download')}</div>`,'نتائج التحليل')+`<div class="print-only"><h2>حَصين | تقرير استرشادي</h2></div>${r.demo?notice('النتائج محسوبة فعلاً بخوارزمية تشابه، لكن قاعدة العلامات تجريبية وليست من سجلات الهيئة. السوابق أحكام منشورة لديوان المظالم صُنّفت بقراءة أولية وتحتاج مراجعة قانونية.',true):notice('النتائج استرشادية، ولا تضمن قبول التسجيل أو ثبوت التعدي.')}<div class="result-top"><section class="panel risk-box"><h2>مؤشر خطر التشابه</h2>${sc==null?`<div class="empty">${ico('info')}غير متاح لهذا النوع من الحقوق</div>`:`<div class="gauge" style="--risk-color:${rr[2]};--risk-angle:${Math.max(0,Math.min(100,Number(sc)))*3.6}deg"><div class="gauge-inner"><strong>${esc(sc)}%</strong><small>مؤشر استرشادي</small></div></div>${badge(sc)}`}<p class="sub">ليس احتمالاً إحصائياً لرفض التسجيل.</p></section><section class="panel"><h2>تفاصيل التحليل</h2>${sc==null?`<p class="sub">${esc(r.guidance)}</p>`:[['phonetic','التشابه الصوتي (النطق)'],['orthographic','التشابه الكتابي'],['semantic','التشابه الدلالي (المعنى)']].map(([k,l])=>{let v=r.metrics?.[k];return `<div class="metric"><div class="metric-label"><span>${l}</span><b>${v==null?'غير مقيّم':esc(v)+'%'}</b></div><div class="bar"><span style="width:${Math.max(0,Math.min(100,Number(v)||0))}%;background:${risk(v)[2]}"></span></div></div>`}).join('')}<div class="summary-list"><div><span>نوع الحماية</span><b>${esc(r.classification||type(r.type))}</b></div><div><span>فئة نيس</span><b>${esc(r.niceClass||'—')}</b></div></div></section></div><div class="result-stack">${sc==null?'':`<section class="panel"><div class=  function safeLink(url,label){try{const u=new URL(url);if(u.protocol!=='https:'&&u.protocol!=='http:')return '';return `<a href="${esc(u.href)}" target="_blank" rel="noopener noreferrer">${esc(label)} ${ico('external')}</a>`}catch{return ''}}

 function alerts(){return head('التنبيهات','راجع مؤشرات التشابه واتخذ الإجراء المناسب بعد التحقق.',btn('تحديد الكل كمقروء','read-all','check','secondary'))+notice('لا تُعرض مهلة اعتراض دون تاريخ نشر ومصدر موثوق. راجع الجهة المختصة قبل اتخاذ إجراء قانوني.')+`<section class="panel" style="padding:0;overflow:hidden"><div class="filters" style="padding:16px 16px 0"><select class="filter-input" id="alertFilter" aria-label="حالة التنبيه"><option value="all">كل التنبيهات</option><option value="unread" ${filter.alerts==='unread'?'selected':''}>غير مقروءة</option></select></div><div id="alertRows">${alertRows()}</div></section>`}function alertRows(){const arr=data.alerts.filter(a=>filter.alerts==='all'||!a.read);return arr.map(a=>`<article class="alert-full ${a.read?'':'unread'}"><span class="stat-icon ${a.score>=75?'red':'amber'}">${ico('bell')}</span><div style="flex:1;min-width:180px"><h3>تشابه محتمل: ${esc(a.name)} / ${esc(a.candidate)}</h3><p>${esc(a.reason)}</p><p>${fmt(a.createdAt)} · ${a.demo?'محاكاة':'تنبيه'} · المهلة: ${a.deadline?fmt(a.deadline):'غير متحققة'}</p></div><div class="actions">${badge(a.score)}${btn('التفاصيل','alert-detail','eye','secondary',`data-id="${esc(a.id)}"`)}${a.read?'':btn('تمت القراءة','read-alert','check','ghost',`data-id="${esc(a.id)}"`)}</div></article>`).join('')||empty('لا توجد تنبيهات بهذه الحالة.')}
 function knowledge(){return head('المعرفة القانونية','تعرّف على أنواع الحماية والمصادر التي يمكن ربطها بالمنصة.')+notice('هذه إرشادات عامة. تتضمن النسخة الحالية عشرة أحكام منشورة لديوان المظالم مصنّفة بقراءة أولية، ولا تتضمن نصوصاً نظامية مسترجعة آلياً.')+`<div class="knowledge-grid">${types.slice(0,4).map(([id,t,d,i])=>`<article class="panel"><span class="tile-icon">${ico(i)}</span><h2>${t}</h2><p>${d}.</p><p>${id==='trademark'?'استشارة وتصنيف وتحليل تشابه ورصد':id==='patent'?'استشارة وتصنيف ورصد': 'استشارة وتصنيف مبدئي فقط'}.</p>${btn('بدء الاستشارة','knowledge-type','arrow','ghost',`data-id="${id}"`)}</article>`).join('')}<article class="panel"><span class="tile-icon">${ico('scale')}</span><h2>المصادر الرسمية</h2><p>مداخل للبحث والتحقق اليدوي، لا تمثل مراجع مسترجعة لنتيجة بعينها.</p>${safeLink('https://www.saip.gov.sa/','الهيئة السعودية للملكية الفكرية')}${safeLink('https://laws.boe.gov.sa/','بوابة الأنظمة السعودية')}${safeLink('https://www.wipo.int/classifications/nice/','تصنيف نيس – WIPO')}</article><article class="panel"><span class="tile-icon">${ico('book')}</span><h2>الأحكام القضائية</h2><p>عشرة أحكام منشورة لديوان المظالم في العلامات والأسماء التجارية، تُسترجع حسب نوع التشابه وقرب الفئة وتظهر في تقرير التحليل.</p><span class="badge neutral">10 أحكام · مراجعة قانونية مطلوبة</span></article></div>`}

 function openDialog(title,body){$('#dialogContent').innerHTML=`<div class="dialog-head"><h2>${title}</h2><button class="icon-btn" data-action="close-dialog" aria-label="إغلاق">${ico('x')}</button></div>${body}`;dialog.showModal()}function watchDialog(r={}){openDialog('إنشاء ملف حماية',`<p class="sub">${api.mode==='demo'?'أدخل بيانات حق افتراضي مسجل لاختبار الرصد.':'أدخل بيانات الحق المسجل بدقة.'}</p><form id="watchForm"><div class="fields">${field('اسم الحق','name',r.name||'','مثال: نواة',true,true)}<div class="field full"><label for="watchType">نوع الحق</label><select name="type" id="watchType"><option value="trademark">علامة تجارية</option><option value="patent" ${r.type==='patent'?'selected':''}>براءة اختراع</option></select></div>${field('رقم التسجيل','number','','DEMO-003',true,true)}${field('تاريخ التسجيل','registeredAt','','',false,true,'date')}${field('فئة نيس (للعلامة)','niceClass',r.niceClass||'','1–45')}</div><button class="btn" type="submit">${ico('plus')} إنشاء ملف الحماية</button></form>`)}function capture(){const f=$('#analysisForm');if(f){const v=Object.fromEntries(new FormData(f));Object.assign(draft,v)}}function clearFile(){if(preview)URL.revokeObjectURL(preview);preview='';file=null}async function act(action,id){switch(action){case 'choose-type':if(draft.type!==id){clearFile();draft.niceClass=''}draft.type=id;render();break;case 'knowledge-type':draft=blank();draft.type=id;step=1;clearFile();navigate('analysis');break;case 'next':if(step===2){const f=$('#analysisForm');if(!f.reportValidity())return;capture()}step=Math.min(3,step+1);render();break;case 'prev':capture();step=Math.max(1,step-1);render();break;case 'remove-file':capture();clearFile();render();break;case 'submit-analysis':if(!draft.consent){toast('يرجى الموافقة على الإقرار أولاً.');return}if(busy)return;busy=true;render();try{const r=await api.analyze({...draft},file);step=1;draft=blank();clearFile();await refresh();navigate('result/'+r.id);toast('تم إنشاء تقرير التحليل.')}finally{busy=false;if(page==='analysis')render()}break;case 'view':navigate('result/'+id);break;case 'scenario':case 'scenario2':{const r=await api.analyze({type:'trademark',name:action==='scenario'?'رِواء':'رِفاء',activity:'لوحات فنية',niceClass:'35',description:''});await refresh();navigate('result/'+r.id);break}case 'print':window.print();break;case 'new-watch':watchDialog();break;case 'watch-from-report':watchDialog(data.reports.find(r=>r.id===id));break;case 'close-dialog':dialog.close();break;case 'toggle-watch':{const w=data.watches.find(w=>w.id===id);await api.updateWatch(id,{active:!w.active});await refresh();render();toast('تم تحديث حالة الرصد.');break}case 'delete-watch':openDialog('حذف ملف الحماية',`<p class="sub">سيُحذف ملف الرصد وتنبيهاته المرتبطة من بيانات العرض.</p><div class="form-actions">${btn('إلغاء','close-dialog','','secondary')}${btn('تأكيد الحذف','confirm-delete','trash','danger',`data-id="${esc(id)}"`)}</div>`);break;case 'confirm-delete':await api.deleteWatch(id);dialog.close();await refresh();render();toast('تم حذف الملف.');break;case 'check-watch':{const a=await api.checkWatch(id);await refresh();render();toast(a?'رُصد منشور مشابه محتمل.':'لا توجد منشورات جديدة قريبة من علامتك.');break}case 'read-alert':await api.readAlert(id);await refresh();render();break;case 'read-all':await api.readAll();await refresh();render();toast('تم تحديث حالة التنبيهات.');break;case 'alert-detail':{const a=data.alerts.find(a=>a.id===id);await api.readAlert(id);await refresh();render();openDialog('تفاصيل التنبيه',`<div class="summary-list"><div><span>الحق المحمي</span><b>${esc(a.name)}</b></div><div><span>الاسم المشابه</span><b>${esc(a.candidate)}</b></div><div><span>مؤشر التشابه</span><b>${esc(a.score)}%</b></div><div><span>تاريخ النشر</span><b>${fmt(a.publishedAt)}</b></div><div><span>مهلة الاعتراض</span><b>${a.deadline?fmt(a.deadline):'غير متحققة'}</b></div></div><p class="sub">${esc(a.reason)}</p>${a.sourceUrl?safeLink(a.sourceUrl,'مصدر النشر'):notice('لا يوجد مصدر نش sage)}finally{if(b&&b.isConnected)b.disabled=false}});$('#mobileMenu').onclick=()=>{$('#sidebar').classList.toggle('open');$('#scrim').classList.toggle('open')};$('#scrim').onclick=()=>{$('#sidebar').classList.remove('open');$('#scrim').classList.remove('open')};window.addEventListener('hashchange',route);main.innerHTML='<div class="loading"><div class="spinner"></div>تحميل مساحة العمل…</div>';refresh().then(route).catch(err=>{main.innerHTML=notice(esc(err.message),true);});})();
